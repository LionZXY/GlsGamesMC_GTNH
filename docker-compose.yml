services:
  mc_gtnh:
    build:
      context: .
    ports:
      - "25567:25565"
    environment:
      MC_RAM: "32G"
      SECRET_WORLD_SEED: HIGHSECRET
    volumes:
      - ./data/worlds:/app/worlds
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
      - ./data/config/telegrambridge.json:/app/config/telegrambridge.json
      - ./data/config/glitchlessauth.cfg:/app/config/glitchlessauth.cfg
      - ./data/storage:/app/storage
      - ./data/config/JourneyMapServer:/app/config/JourneyMapServer
